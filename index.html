<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b16">
  <meta name="description" content="Vinastra Aerospace develops proposed systems for autonomous construction and infrastructure beyond Earth.">
  <title>Vinastra Aerospace | Initialising</title>
  <link rel="icon" href="/public/favicon_io/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/motion.css">
</head>
<body>
  <main class="loader intro-screen" aria-labelledby="intro-title">
    <div class="loader-mark"><img src="/public/favicon_io/android-chrome-512x512.png" alt="VINASTRA Aerospace emblem"></div>
    <p id="intro-title" class="loader-wordmark">VINASTRA<span>AEROSPACE</span></p>
    <p class="loader-status"><i></i><span id="loader-message">INITIALIZING SYSTEM</span><b>VNA / 001</b></p>
    <a class="intro-skip" href="/home/">Skip intro <span>↗</span></a>
  </main>
  <script>
    const destination = '/home/';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const returningVisitor = sessionStorage.getItem('vinastra-intro-seen') === '1';
    const delay = reducedMotion || returningVisitor ? 120 : 1500;
    sessionStorage.setItem('vinastra-intro-seen', '1');
    window.setTimeout(() => { window.location.replace(destination); }, delay);
  </script>
</body>
</html>
